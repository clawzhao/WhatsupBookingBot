<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookings — Admin</title>
  <style>
    /* ─── Design System ────────────────────────────────────────
       Style: Professional BI Dashboard (dark sidebar)
       Colors: Slate-900 sidebar, white canvas, blue-500 accent
    ────────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-bg:    #0f172a;
      --sidebar-hover: #1e293b;
      --sidebar-active:#1d4ed8;
      --sidebar-text:  #94a3b8;
      --sidebar-head:  #f1f5f9;
      --accent:        #3b82f6;
      --accent-light:  #eff6ff;
      --canvas:        #f8fafc;
      --surface:       #ffffff;
      --border:        #e2e8f0;
      --text-primary:  #0f172a;
      --text-secondary:#64748b;
      --badge-confirmed: #22c55e;
      --badge-cancelled: #ef4444;
      --shadow-sm:     0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
      --shadow-md:     0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.04);
      --radius:        10px;
      --transition:    180ms ease;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--canvas);
      color: var(--text-primary);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ─── Sidebar ──────────────────────────── */
    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      padding: 24px 0 16px;
      gap: 4px;
      overflow-y: auto;
    }

    .sidebar-logo {
      padding: 0 20px 20px;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 8px;
    }

    .sidebar-logo span {
      display: block;
      font-size: 1rem;
      font-weight: 700;
      color: var(--sidebar-head);
      letter-spacing: -.01em;
    }

    .sidebar-logo small {
      color: var(--sidebar-text);
      font-size: .72rem;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 20px;
      color: var(--sidebar-text);
      text-decoration: none;
      font-size: .875rem;
      transition: background var(--transition), color var(--transition);
      cursor: pointer;
    }

    .nav-item:hover {
      background: var(--sidebar-hover);
      color: #e2e8f0;
    }

    .nav-item.active {
      background: var(--sidebar-active);
      color: #fff;
    }

    /* ─── Main area ────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ─── Top bar ────────────────────────────── */
    .topbar {
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 12px;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    .topbar h1 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .topbar-spacer { flex: 1; }

    /* ─── Content area ────────────────────────── */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    /* ─── Table Styles ────────────────────────── */
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    thead {
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
    }

    th {
      padding: 12px 16px;
      text-align: left;
      font-weight: 600;
      font-size: .875rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: .01em;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: .875rem;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: .75rem;
      font-weight: 600;
    }

    .badge-confirmed {
      background: #dcfce7;
      color: #166534;
    }

    .badge-cancelled {
      background: #fee2e2;
      color: #991b1b;
    }

    /* ─── Empty State ────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state h3 {
      font-size: 1.125rem;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    /* ─── Coach assign inline ─────────────────── */
    .coach-assign {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .coach-assign select {
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: .8rem;
      background: #fff;
      cursor: pointer;
    }
    .coach-assign button {
      padding: 4px 10px;
      font-size: .75rem;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .coach-assign button:hover { background: #2563eb; }

    /* ─── Responsive ────────────────────────── */
    @media (max-width: 768px) {
      .sidebar { width: 70px; }
      .sidebar-logo { padding: 0; text-align: center; }
      .sidebar-logo span { font-size: .75rem; }
      .nav-item { justify-content: center; padding: 9px; }
      body { flex-direction: column; }
      .sidebar { width: 100%; height: auto; order: 2; }
    }
  </style>
</head>
<body>
  <!-- Sidebar Navigation -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span>📋 Admin</span>
      <small>Booking System</small>
    </div>
    <a class="nav-item active" href="/bookings.html">📅 Bookings</a>
    <a class="nav-item" href="/config.html">⚙️ Configuration</a>
    <a class="nav-item" href="/coaches.html">👥 Coaches</a>
    <a class="nav-item" href="/coach-schedule.html">📋 Coach Schedule</a>
    <a class="nav-item" href="/chatbot.html">🤖 Chatbot Q&amp;A</a>
    <a class="nav-item" href="/chat-history.html">💬 Chat History</a>
  </aside>

  <!-- Main Content Area -->
  <main class="main">
    <div class="topbar">
      <h1>📅 Bookings</h1>
      <div class="topbar-spacer"></div>
    </div>

    <div class="content">
      <table id="bookings-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Chat ID / Phone</th>
            <th>Party Size</th>
            <th>Date</th>
            <th>Time</th>
            <th>Coach</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <!-- Populated via JS -->
        </tbody>
      </table>
    </div>
  </main>

  <script>
    let _coaches = [];

    async function loadCoachesList() {
      try {
        const res = await fetch('/api/config');
        const cfg = await res.json();
        _coaches = (cfg.restaurant?.coaches || []).filter(c => c.status === 'available');
      } catch (e) { _coaches = []; }
    }

    function coachCell(b) {
      if (b.coach_id && b.coach_name) {
        return `<a href="/coach-schedule.html?coachId=${b.coach_id}&date=${b.date}">${b.coach_name}</a>`;
      }
      if (b.status !== 'confirmed') return b.coach_name || '—';
      // Confirmed but no coach — show assignment dropdown
      const opts = _coaches.map(c => `<option value="${c.id}" data-name="${c.name}">${c.name}</option>`).join('');
      return `<div class="coach-assign">
        <select id="coach-sel-${b.id}">
          <option value="">Assign coach…</option>
          ${opts}
        </select>
        <button onclick="assignCoach(${b.id})">Assign</button>
      </div>`;
    }

    async function assignCoach(bookingId) {
      const sel = document.getElementById(`coach-sel-${bookingId}`);
      if (!sel || !sel.value) return alert('Please select a coach first.');
      const coachId = sel.value;
      const coachName = sel.options[sel.selectedIndex].dataset.name;
      const res = await fetch(`/api/bookings/${bookingId}/assign-coach`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ coachId, coachName })
      });
      const data = await res.json();
      if (data.success) {
        loadBookings();
      } else {
        alert('Failed to assign coach: ' + (data.error || 'Unknown error'));
      }
    }

    async function loadBookings() {
      try {
        const response = await fetch('/api/bookings');
        const bookings = await response.json();
        const tbody = document.querySelector('#bookings-table tbody');

        if (bookings.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:48px"><div class="empty-state"><div class="empty-state-icon">📭</div><h3>No bookings yet</h3><p>Bookings will appear here when users book through the chatbot.</p></div></td></tr>';
          return;
        }

        tbody.innerHTML = bookings.map(b => `
          <tr>
            <td>#${b.id}</td>
            <td>${b.chat_id || b.phone || 'N/A'}</td>
            <td>${b.partySize ?? b.party_size ?? '—'}</td>
            <td>${b.date}</td>
            <td>${b.time}</td>
            <td>${coachCell(b)}</td>
            <td><span class="badge ${b.status === 'confirmed' ? 'badge-confirmed' : 'badge-cancelled'}">${b.status}</span></td>
          </tr>
        `).join('');
      } catch (error) {
        console.error('Failed to load bookings:', error);
      }
    }

    async function init() {
      await loadCoachesList();
      await loadBookings();
      setInterval(loadBookings, 30000);
    }
    init();
  </script>
</body>
</html>
