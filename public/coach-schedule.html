<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coach Schedule — Admin</title>
  <style>
    /* Design System */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-bg:    #0f172a;
      --sidebar-hover: #1e293b;
      --sidebar-active:#1d4ed8;
      --sidebar-text:  #94a3b8;
      --sidebar-head:  #f1f5f9;
      --accent:        #3b82f6;
      --accent-light:  #eff6ff;
      --canvas:        #f8fafc;
      --surface:       #ffffff;
      --border:        #e2e8f0;
      --text-primary:  #0f172a;
      --text-secondary:#64748b;
      --success:       #22c55e;
      --error:         #ef4444;
      --shadow-sm:     0 1px 3px rgba(0,0,0,.08);
      --radius:        10px;
      --transition:    180ms ease;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--canvas);
      color: var(--text-primary);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      padding: 24px 0 16px;
      gap: 4px;
      overflow-y: auto;
    }

    .sidebar-logo {
      padding: 0 20px 20px;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 8px;
    }

    .sidebar-logo span {
      display: block;
      font-size: 1rem;
      font-weight: 700;
      color: var(--sidebar-head);
    }

    .sidebar-logo small {
      color: var(--sidebar-text);
      font-size: .72rem;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 20px;
      color: var(--sidebar-text);
      text-decoration: none;
      font-size: .875rem;
      transition: background var(--transition), color var(--transition);
      cursor: pointer;
    }

    .nav-item:hover { background: var(--sidebar-hover); color: #e2e8f0; }
    .nav-item.active { background: var(--sidebar-active); color: #fff; }

    /* Main area */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 12px;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    .topbar h1 { font-size: 1rem; font-weight: 600; color: var(--text-primary); }
    .topbar-spacer { flex: 1; }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .controls select {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: .875rem;
      background: var(--surface);
      cursor: pointer;
    }

    /* Schedule Table */
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    thead {
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
    }

    th {
      padding: 12px 16px;
      text-align: left;
      font-weight: 600;
      font-size: .875rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: .01em;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: .875rem;
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    .booking-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .booking-item {
      background: var(--accent-light);
      color: var(--accent);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: .75rem;
      font-weight: 600;
    }

    .booking-item.unavailable {
      background: #fee2e2;
      color: var(--error);
    }

    /* Coach Info Card */
    .coach-info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }

    .coach-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .coach-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--accent);
    }

    .coach-info h2 {
      font-size: 1.25rem;
      color: var(--text-primary);
    }

    .coach-status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: .875rem;
      font-weight: 600;
    }

    .coach-status.available {
      background: #dcfce7;
      color: #166534;
    }

    .coach-status.unavailable {
      background: #fee2e2;
      color: #991b1b;
    }

    .coach-contact {
      font-size: .875rem;
      color: var(--text-secondary);
      margin-top: 8px;
    }

    /* Buttons */
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: .875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background var(--transition);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover { background: #2563eb; }

    .btn-danger {
      background: #fee2e2;
      color: var(--error);
      padding: 4px 10px;
      font-size: .75rem;
    }

    .btn-danger:hover { background: #fecaca; }

    /* ─── Modal Overlay ───────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.45);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 12px;
      padding: 28px 32px;
      width: 480px;
      max-width: 96vw;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 48px rgba(0,0,0,.18);
    }

    .modal h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; }

    .form-row { margin-bottom: 14px; }
    .form-row label { display: block; font-size: .8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .02em; }
    .form-row input, .form-row select, .form-row textarea {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border);
      border-radius: 6px; font-size: .875rem; background: #fff;
    }
    .form-row textarea { resize: vertical; min-height: 64px; }

    .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .type-btn {
      padding: 8px 12px; border: 2px solid var(--border); border-radius: 8px;
      background: #fff; font-size: .8rem; font-weight: 600; cursor: pointer;
      transition: all 140ms ease; text-align: center; color: var(--text-secondary);
    }
    .type-btn.selected { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }

    .custom-range { display: none; }
    .custom-range.show { display: block; }

    .time-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .modal-actions .btn-cancel {
      padding: 8px 20px; border: 1px solid var(--border); border-radius: 6px;
      background: #fff; font-size: .875rem; cursor: pointer;
    }
    .modal-actions .btn-save {
      padding: 8px 20px; background: var(--error); color: #fff;
      border: none; border-radius: 6px; font-size: .875rem; font-weight: 600; cursor: pointer;
    }
    .modal-actions .btn-save:hover { background: #dc2626; }

    .affected-list { margin-top: 16px; }
    .affected-list h3 { font-size: .875rem; font-weight: 600; margin-bottom: 8px; }
    .affected-item {
      background: #fff7ed; border: 1px solid #fed7aa; border-radius: 6px;
      padding: 8px 12px; margin-bottom: 6px; font-size: .8rem;
    }
    .notify-bar {
      display: flex; gap: 10px; align-items: center; margin-top: 14px;
      padding: 12px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px;
    }
    .notify-bar p { flex: 1; font-size: .8rem; color: #166534; }

    /* ─── Unavailability badge in table ─────── */
    .badge-unavail {
      display: inline-block; padding: 2px 8px; background: #fee2e2;
      color: #991b1b; border-radius: 4px; font-size: .7rem; font-weight: 600;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-secondary);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { width: 70px; }
      .nav-item { justify-content: center; }
      .controls { flex-direction: column; }
      table { font-size: .75rem; }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span>📋 Admin</span>
      <small>Booking System</small>
    </div>
    <a class="nav-item" href="/bookings.html">📅 Bookings</a>
    <a class="nav-item" href="/config.html">⚙️ Configuration</a>
    <a class="nav-item" href="/coaches.html">👥 Coaches</a>
    <a class="nav-item active" href="/coach-schedule.html">📅 Coach Schedule</a>
    <a class="nav-item" href="/chatbot.html">🤖 Chatbot Q&amp;A</a>
    <a class="nav-item" href="/chat-history.html">💬 Chat History</a>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <h1>📅 Coach Schedule</h1>
      <div class="topbar-spacer"></div>
    </div>

    <div class="content">
      <div class="controls">
        <select id="coach-select" onchange="loadCoachSchedule()">
          <option value="">Select a coach...</option>
        </select>
        <input type="date" id="start-date" onchange="loadCoachSchedule()">
        <button class="btn-danger" onclick="openUnavailModal()" style="padding:8px 14px;font-size:.8rem;">🚫 Mark Unavailable</button>
      </div>

      <div id="schedule-container">
        <!-- Populated via JS -->
      </div>
    </div>
  </main>

  <!-- Unavailability Modal -->
  <div class="modal-overlay" id="unavail-modal">
    <div class="modal">
      <h2>🚫 Mark Coach Unavailable</h2>

      <div class="form-row">
        <label>Coach</label>
        <select id="um-coach">
          <option value="">Select a coach…</option>
        </select>
      </div>

      <div class="form-row">
        <label>Reason</label>
        <textarea id="um-reason" placeholder="e.g. Sick leave, Personal emergency…"></textarea>
      </div>

      <div class="form-row">
        <label>Unavailability Type</label>
        <div class="type-grid">
          <button class="type-btn selected" data-type="whole_day" onclick="selectType(this)">🗓 Whole Day</button>
          <button class="type-btn" data-type="am" onclick="selectType(this)">🌅 AM (before noon)</button>
          <button class="type-btn" data-type="pm" onclick="selectType(this)">🌇 PM (noon onwards)</button>
          <button class="type-btn" data-type="custom" onclick="selectType(this)">⏱ Custom Range</button>
        </div>
      </div>

      <div class="form-row">
        <label>Start Date</label>
        <input type="date" id="um-start-date">
      </div>

      <div class="form-row">
        <label>End Date <span style="font-weight:400;text-transform:none">(leave same for single day)</span></label>
        <input type="date" id="um-end-date">
      </div>

      <div class="custom-range" id="um-custom-times">
        <div class="time-row">
          <div class="form-row">
            <label>Start Time</label>
            <input type="time" id="um-start-time">
          </div>
          <div class="form-row">
            <label>End Time</label>
            <input type="time" id="um-end-time">
          </div>
        </div>
      </div>

      <div id="um-affected" class="affected-list" style="display:none"></div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeUnavailModal()">Cancel</button>
        <button class="btn-save" id="um-save-btn" onclick="saveUnavailability()">Save &amp; Check Impact</button>
      </div>
    </div>
  </div>

  <script>
    let _currentConfig = {};

    async function loadCoaches() {
      try {
        const response = await fetch('/api/config');
        _currentConfig = await response.json();
        const coaches = _currentConfig.restaurant?.coaches || [];

        const select = document.getElementById('coach-select');
        const options = coaches.map(c => `<option value="${c.id}">${c.name}</option>`);
        select.innerHTML = '<option value="">Select a coach...</option>' + options.join('');
      } catch (error) {
        console.error('Failed to load coaches:', error);
      }
    }

    function getDateRange() {
      const startDateEl = document.getElementById('start-date');
      let startStr;

      if (startDateEl.value) {
        startStr = startDateEl.value;
      } else {
        // Default to today, set input
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        startStr = `${year}-${month}-${day}`;
        startDateEl.value = startStr;
      }

      // Calculate end date string (7 days later) — YYYY-MM-DD strings sort/compare correctly
      const endDateObj = new Date(startStr + 'T00:00:00');
      endDateObj.setDate(endDateObj.getDate() + 7);
      const endStr = endDateObj.toISOString().slice(0, 10);

      return [startStr, endStr];
    }

    async function loadCoachSchedule() {
      const coachId = document.getElementById('coach-select').value;
      if (!coachId) {
        document.getElementById('schedule-container').innerHTML = '<div class="empty-state"><p>Select a coach to view their schedule</p></div>';
        return;
      }

      const coaches = _currentConfig.restaurant?.coaches || [];
      const coach = coaches.find(c => c.id === coachId);
      if (!coach) return;

      try {
        const response = await fetch('/api/bookings');
        const bookings = await response.json();

        const [startStr, endStr] = getDateRange();
        const coachBookings = bookings.filter(b => 
          b.coach_id === coachId && 
          b.date >= startStr && 
          b.date <= endStr &&
          b.status === 'confirmed'
        );

        // Group bookings by date
        const scheduleByDate = {};
        coachBookings.forEach(b => {
          if (!scheduleByDate[b.date]) scheduleByDate[b.date] = [];
          scheduleByDate[b.date].push(b);
        });

        // Sort dates
        const sortedDates = Object.keys(scheduleByDate).sort();

        let html = `
          <div class="coach-info-card">
            <div class="coach-header">
              <div class="coach-avatar">${coach.name.charAt(0).toUpperCase()}</div>
              <div>
                <h2>${coach.name}</h2>
                <span class="coach-status ${coach.status === 'available' ? 'available' : 'unavailable'}">
                  ${coach.status === 'available' ? '✓ Available' : '✗ Unavailable'}
                </span>
                <div class="coach-contact">
                  <p>📞 ${coach.phone || 'N/A'} | ✉️ ${coach.email || 'N/A'}</p>
                </div>
              </div>
            </div>
          </div>

          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Day</th>
                <th>Time</th>
                <th>Student</th>
                <th>Duration</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
        `;

        if (sortedDates.length === 0) {
          html += '<tr><td colspan="7" style="text-align:center;padding:48px;color:#999;">No bookings scheduled for this week</td></tr>';
        } else {
          sortedDates.forEach(date => {
            scheduleByDate[date].forEach(booking => {
              const dateObj = new Date(date);
              const day = dateObj.toLocaleDateString('en-US', { weekday: 'long' });
              html += `
                <tr>
                  <td>${date}</td>
                  <td>${day}</td>
                  <td>${booking.time}</td>
                  <td>${booking.phone || 'Unknown'}</td>
                  <td>60 min</td>
                  <td><span style="background:#dcfce7;color:#166534;padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:600;">Confirmed</span></td>
                  <td>
                    <button class="btn-danger" onclick="markCoachUnavailable('${coachId}', '${date}')">Mark Sick</button>
                  </td>
                </tr>
              `;
            });
          });
        }

        html += `
            </tbody>
          </table>
        `;

        document.getElementById('schedule-container').innerHTML = html;
      } catch (error) {
        console.error('Failed to load schedule:', error);
        document.getElementById('schedule-container').innerHTML = '<div class="empty-state"><p>Error loading schedule</p></div>';
      }
    }

    async function markCoachUnavailable(coachId, date) {
      // Open the modal pre-filled with this coach & date
      openUnavailModal(coachId, date);
    }

    // ─── Unavailability Modal ──────────────────────────────────────

    function openUnavailModal(preCoachId, preDate) {
      // Populate coach dropdown from config
      const coaches = _currentConfig.restaurant?.coaches || [];
      const umCoach = document.getElementById('um-coach');
      umCoach.innerHTML = '<option value="">Select a coach…</option>' +
        coaches.map(c => `<option value="${c.id}" data-name="${c.name}">${c.name}</option>`).join('');
      if (preCoachId) umCoach.value = preCoachId;
      else {
        const sel = document.getElementById('coach-select').value;
        if (sel) umCoach.value = sel;
      }

      const today = preDate || document.getElementById('start-date').value || new Date().toISOString().slice(0, 10);
      document.getElementById('um-start-date').value = today;
      document.getElementById('um-end-date').value = today;
      document.getElementById('um-reason').value = '';
      document.getElementById('um-affected').style.display = 'none';
      document.getElementById('um-affected').innerHTML = '';
      document.getElementById('um-save-btn').textContent = 'Save & Check Impact';
      document.getElementById('um-save-btn').onclick = saveUnavailability;

      // Reset type selection
      document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
      document.querySelector('.type-btn[data-type="whole_day"]').classList.add('selected');
      document.getElementById('um-custom-times').classList.remove('show');

      document.getElementById('unavail-modal').classList.add('open');
    }

    function closeUnavailModal() {
      document.getElementById('unavail-modal').classList.remove('open');
    }

    function selectType(btn) {
      document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      const isCustom = btn.dataset.type === 'custom';
      document.getElementById('um-custom-times').classList.toggle('show', isCustom);
    }

    async function saveUnavailability() {
      const coachSel = document.getElementById('um-coach');
      const coachId = coachSel.value;
      const coachName = coachId ? coachSel.options[coachSel.selectedIndex].dataset.name : '';
      const reason = document.getElementById('um-reason').value.trim() || 'Unavailable';
      const type = document.querySelector('.type-btn.selected')?.dataset.type || 'whole_day';
      const startDate = document.getElementById('um-start-date').value;
      const endDate = document.getElementById('um-end-date').value || startDate;
      const startTime = document.getElementById('um-start-time').value || null;
      const endTime = document.getElementById('um-end-time').value || null;

      if (!coachId) return alert('Please select a coach.');
      if (!startDate) return alert('Please select a start date.');
      if (type === 'custom' && (!startTime || !endTime)) return alert('Please enter start and end times for custom range.');
      if (endDate < startDate) return alert('End date cannot be before start date.');

      const btn = document.getElementById('um-save-btn');
      btn.disabled = true;
      btn.textContent = 'Saving…';

      try {
        const res = await fetch('/api/coach-unavailability', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ coachId, coachName, reason, type, startDate, endDate, startTime, endTime })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Save failed');

        const affected = data.affectedBookings || [];
        const affectedEl = document.getElementById('um-affected');
        affectedEl.style.display = 'block';

        if (affected.length === 0) {
          affectedEl.innerHTML = `<div class="notify-bar"><p>✅ Unavailability saved. No confirmed bookings are affected during this period.</p></div>`;
          btn.textContent = 'Done';
          btn.disabled = false;
          btn.onclick = closeUnavailModal;
          loadCoachSchedule();
          return;
        }

        const typeLabel = { whole_day: 'Whole Day', am: 'AM (before noon)', pm: 'PM (noon onward)', custom: 'Custom Range' }[type] || type;
        affectedEl.innerHTML = `
          <h3>⚠️ ${affected.length} booking(s) affected</h3>
          ${affected.map(b => `<div class="affected-item">📌 Booking #${b.id} — ${b.date} at ${b.time} (${b.phone || 'Chat: ' + b.chatId})</div>`).join('')}
          <div class="notify-bar">
            <p>Send Telegram notification to ${affected.filter(b => b.chatId).length} customer(s) who booked via Telegram?</p>
            <button class="btn-save" style="white-space:nowrap" onclick="sendNotifications('${coachName.replace(/'/g,"\\'")}','${reason.replace(/'/g,"\\'")}',${JSON.stringify(affected)})">📨 Notify All</button>
          </div>`;

        btn.textContent = 'Close';
        btn.disabled = false;
        btn.onclick = () => { closeUnavailModal(); loadCoachSchedule(); };
      } catch (err) {
        alert('Error: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Save & Check Impact';
      }
    }

    async function sendNotifications(coachName, reason, affectedBookings) {
      const notifyBtn = event.target;
      notifyBtn.disabled = true;
      notifyBtn.textContent = 'Sending…';
      try {
        const res = await fetch('/api/coach-unavailability/notify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ coachName, reason, affectedBookings })
        });
        const data = await res.json();
        notifyBtn.parentElement.innerHTML = `<p>✅ Sent ${data.sent} notification(s)${data.failed ? ', ' + data.failed + ' failed' : ''}.</p>`;
      } catch (err) {
        notifyBtn.textContent = 'Retry';
        notifyBtn.disabled = false;
        alert('Notification error: ' + err.message);
      }
    }

    // Close modal on overlay click
    document.getElementById('unavail-modal').addEventListener('click', function(e) {
      if (e.target === this) closeUnavailModal();
    });

    // Load coaches and set up date picker, then apply any URL params
    async function init() {
      await loadCoaches();
      const params = new URLSearchParams(location.search);
      const paramDate = params.get('date');
      if (paramDate) {
        document.getElementById('start-date').value = paramDate;
      } else {
        document.getElementById('start-date').valueAsDate = new Date();
      }
      const paramCoachId = params.get('coachId');
      if (paramCoachId) {
        document.getElementById('coach-select').value = paramCoachId;
        loadCoachSchedule();
      }
    }
    init();
  </script>
</body>
</html>
