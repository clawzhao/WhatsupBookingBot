<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat History — Admin</title>
  <script src="api.js"></script>
  <style>
    /* ─── Design System ─────────────────────────────────────────
       Style: Professional BI Dashboard (dark sidebar)
       Product: Booking & Appointment / Coaching
       Colors: Slate-900 sidebar, white canvas, blue-500 accent
       Typography: System stack (Inter-like)
    ──────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-bg:    #0f172a;
      --sidebar-hover: #1e293b;
      --sidebar-active:#1d4ed8;
      --sidebar-text:  #94a3b8;
      --sidebar-head:  #f1f5f9;
      --accent:        #3b82f6;
      --accent-light:  #eff6ff;
      --canvas:        #f8fafc;
      --surface:       #ffffff;
      --border:        #e2e8f0;
      --text-primary:  #0f172a;
      --text-secondary:#64748b;
      --in-bubble:     #f1f5f9;
      --out-bubble:    #3b82f6;
      --out-text:      #ffffff;
      --badge-tg:      #229ed9;
      --badge-wa:      #25d366;
      --badge-sys:     #f59e0b;
      --shadow-sm:     0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
      --shadow-md:     0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.04);
      --radius:        10px;
      --transition:    180ms ease;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
      background: var(--canvas);
      color: var(--text-primary);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ─── Sidebar ─────────────────────────────── */
    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      padding: 24px 0 16px;
      gap: 4px;
    }
    .sidebar-logo {
      padding: 0 20px 20px;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 8px;
    }
    .sidebar-logo span {
      display: block;
      font-size: 1rem;
      font-weight: 700;
      color: var(--sidebar-head);
      letter-spacing: -.01em;
    }
    .sidebar-logo small {
      color: var(--sidebar-text);
      font-size: .72rem;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 20px;
      color: var(--sidebar-text);
      text-decoration: none;
      font-size: .875rem;
      border-radius: 0;
      transition: background var(--transition), color var(--transition);
      cursor: pointer;
    }
    .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
    .nav-item:hover { background: var(--sidebar-hover); color: #e2e8f0; }
    .nav-item.active { background: var(--sidebar-active); color: #fff; }
    .sidebar-spacer { flex: 1; }

    /* ─── Main area ────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ─── Top bar ──────────────────────────────── */
    .topbar {
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 12px;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }
    .topbar h1 { font-size: 1rem; font-weight: 600; color: var(--text-primary); }
    .topbar-spacer { flex: 1; }
    .topbar-badge {
      background: var(--accent-light);
      color: var(--accent);
      padding: 3px 10px;
      border-radius: 99px;
      font-size: .78rem;
      font-weight: 600;
    }
    .btn-refresh {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 6px 16px;
      border-radius: 6px;
      font-size: .82rem;
      font-weight: 500;
      cursor: pointer;
      transition: background var(--transition);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-refresh:hover { background: #2563eb; }
    .btn-refresh svg { width: 14px; height: 14px; }

    /* ─── Content area ─────────────────────────── */
    .content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ─── Conversation list ────────────────────── */
    .conv-panel {
      width: 300px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .conv-search {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .conv-search input {
      width: 100%;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: .85rem;
      color: var(--text-primary);
      outline: none;
      transition: border-color var(--transition);
    }
    .conv-search input:focus { border-color: var(--accent); }
    .conv-list { flex: 1; overflow-y: auto; }
    .conv-item {
      padding: 12px 16px;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      transition: background var(--transition);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .conv-item:hover { background: #f8fafc; }
    .conv-item.selected { background: var(--accent-light); border-left: 3px solid var(--accent); }
    .conv-item-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #fff;
      font-weight: 700;
      font-size: .85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .conv-meta { flex: 1; min-width: 0; }
    .conv-name {
      font-size: .875rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conv-time {
      font-size: .72rem;
      color: var(--text-secondary);
      white-space: nowrap;
      margin-left: auto;
    }
    .conv-preview {
      font-size: .78rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-left: 44px;
    }
    .platform-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 7px;
      border-radius: 99px;
      font-size: .68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: #fff;
    }
    .platform-badge.telegram { background: var(--badge-tg); }
    .platform-badge.whatsapp { background: var(--badge-wa); }
    .msg-count {
      background: var(--accent);
      color: #fff;
      border-radius: 99px;
      font-size: .68rem;
      font-weight: 700;
      padding: 1px 7px;
      margin-left: auto;
    }
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-secondary);
      padding: 32px;
      text-align: center;
    }
    .empty-state svg { width: 48px; height: 48px; opacity: .3; }
    .empty-state p { font-size: .875rem; }

    /* ─── Chat panel ───────────────────────────── */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--canvas);
    }
    .chat-header {
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      flex-shrink: 0;
    }
    .chat-header-name {
      font-weight: 600;
      font-size: .95rem;
    }
    .chat-header-sub {
      font-size: .78rem;
      color: var(--text-secondary);
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chat-date-divider {
      text-align: center;
      font-size: .72rem;
      color: var(--text-secondary);
      margin: 12px 0 4px;
      position: relative;
    }
    .chat-date-divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--border);
      z-index: 0;
    }
    .chat-date-divider span {
      position: relative;
      background: var(--canvas);
      padding: 0 10px;
      z-index: 1;
    }
    .msg-row {
      display: flex;
      gap: 8px;
      max-width: 72%;
    }
    .msg-row.outbound {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .msg-row.inbound { align-self: flex-start; }
    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #fff;
      font-size: .7rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg-avatar.bot { background: linear-gradient(135deg, #059669, #10b981); }
    .msg-bubble {
      padding: 9px 13px;
      border-radius: 12px;
      font-size: .875rem;
      line-height: 1.45;
      box-shadow: var(--shadow-sm);
      max-width: 100%;
      word-break: break-word;
    }
    .msg-row.inbound .msg-bubble {
      background: var(--surface);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
    }
    .msg-row.outbound .msg-bubble {
      background: var(--out-bubble);
      color: var(--out-text);
      border-bottom-right-radius: 4px;
    }
    .msg-row.outbound .msg-bubble.booking {
      background: #059669;
    }
    .msg-row.outbound .msg-bubble.cancellation {
      background: #dc2626;
    }
    .msg-time {
      font-size: .68rem;
      color: var(--text-secondary);
      margin-top: 3px;
      text-align: right;
    }
    .msg-row.inbound .msg-time { text-align: left; }
    .msg-type-tag {
      display: inline-block;
      font-size: .65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: 1px 6px;
      border-radius: 4px;
      margin-bottom: 4px;
    }
    .msg-type-tag.booking   { background: #d1fae5; color: #065f46; }
    .msg-type-tag.cancellation { background: #fee2e2; color: #991b1b; }
    .msg-type-tag.menu      { background: #e0f2fe; color: #0369a1; }

    /* Loading spinner */
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .no-selection {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-secondary);
    }
    .no-selection svg { width: 64px; height: 64px; opacity: .2; }
    .no-selection h3 { font-size: 1rem; font-weight: 600; color: #94a3b8; }
    .no-selection p { font-size: .85rem; }

    /* Scrollbar */
    .conv-list::-webkit-scrollbar,
    .chat-messages::-webkit-scrollbar { width: 5px; }
    .conv-list::-webkit-scrollbar-track,
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .conv-list::-webkit-scrollbar-thumb,
    .chat-messages::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 99px; }
  </style>
</head>
<body>

<!-- ─── Sidebar ───────────────────────────────────────────── -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <span>Booking Admin</span>
    <small>Management Console</small>
  </div>
  <a href="/bookings.html" class="nav-item">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10m5 0a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V9a2 2 0 012-2h14z" /></svg>

  </a>

<!-- ─── Main ─────────────────────────────────────────────── -->
<div class="main">
  <div class="topbar">
    <h1>Chat History</h1>
    <div class="topbar-spacer"></div>
    <span class="topbar-badge" id="total-badge">0 conversations</span>
    <button class="btn-refresh" onclick="loadConversations()">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
      Refresh
    </button>
  </div>

  <div class="content">
    <!-- Conversation list -->
    <div class="conv-panel">
      <div class="conv-search">
        <input type="text" id="search-input" placeholder="Search by user or message…" oninput="filterConversations()" />
      </div>
      <div class="conv-list" id="conv-list">
        <div class="empty-state">
          <div class="spinner"></div>
          <p>Loading conversations…</p>
        </div>
      </div>
    </div>

    <!-- Chat thread -->
    <div class="chat-panel" id="chat-panel">
      <div class="no-selection">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
        <h3>Select a conversation</h3>
        <p>Choose a user from the left panel to view their messages.</p>
      </div>
    </div>
  </div>
</div>

<script>
let allConversations = [];
let selectedChatId = null;
let selectedPlatform = null;

// ─── Load conversations ──────────────────────────────────────
async function loadConversations() {
  const list = document.getElementById('conv-list');
  list.innerHTML = '<div class="empty-state"><div class="spinner"></div><p>Loading…</p></div>';

  try {
    const res = await fetch('/api/chat-history');
    allConversations = await res.json();
    document.getElementById('total-badge').textContent =
      `${allConversations.length} conversation${allConversations.length !== 1 ? 's' : ''}`;
    renderConversations(allConversations);
  } catch (err) {
    list.innerHTML = `<div class="empty-state"><p style="color:#dc2626">Failed to load: ${err.message}</p></div>`;
  }
}

function renderConversations(convs) {
  const list = document.getElementById('conv-list');
  if (convs.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
        <p>No conversations yet.<br>Messages will appear after users chat with the bot.</p>
      </div>`;
    return;
  }

  list.innerHTML = convs.map(c => {
    const label = c.username || c.chat_id;
    const initial = label.replace('@','').slice(0,1).toUpperCase();
    const isSelected = c.chat_id === selectedChatId && c.platform === selectedPlatform;
    const timeStr = relativeTime(c.last_message_time);
    const preview = (c.last_message || '').slice(0, 48) + (c.last_message?.length > 48 ? '…' : '');
    return `
      <div class="conv-item${isSelected ? ' selected' : ''}"
           onclick="selectConversation('${escJs(c.chat_id)}', '${c.platform}', '${escJs(label)}')">
        <div class="conv-item-header">
          <div class="avatar">${initial}</div>
          <div class="conv-meta">
            <div class="conv-name">${escHtml(label)}</div>
          </div>
          <span class="conv-time">${timeStr}</span>
        </div>
        <div class="conv-preview" style="display:flex;align-items:center;gap:6px;padding-left:44px">
          <span class="platform-badge ${c.platform}">${c.platform === 'telegram' ? 'TG' : 'WA'}</span>
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(preview)}</span>
          <span class="msg-count" style="margin-left:auto;flex-shrink:0">${c.message_count}</span>
        </div>
      </div>`;
  }).join('');
}

function filterConversations() {
  const q = document.getElementById('search-input').value.toLowerCase();
  if (!q) { renderConversations(allConversations); return; }
  renderConversations(allConversations.filter(c =>
    (c.username||'').toLowerCase().includes(q) ||
    (c.chat_id||'').toLowerCase().includes(q) ||
    (c.last_message||'').toLowerCase().includes(q)
  ));
}

// ─── Select conversation ────────────────────────────────────
async function selectConversation(chatId, platform, displayName) {
  selectedChatId = chatId;
  selectedPlatform = platform;

  // Update selected state
  renderConversations(allConversations.filter(c => {
    const q = document.getElementById('search-input').value.toLowerCase();
    return !q || (c.username||'').toLowerCase().includes(q) || (c.chat_id||'').toLowerCase().includes(q) || (c.last_message||'').toLowerCase().includes(q);
  }));

  const panel = document.getElementById('chat-panel');
  panel.innerHTML = `
    <div class="chat-header">
      <div class="avatar" style="width:36px;height:36px;font-size:.9rem">${displayName.replace('@','').slice(0,1).toUpperCase()}</div>
      <div>
        <div class="chat-header-name">${escHtml(displayName)}</div>
        <div class="chat-header-sub">${platform === 'telegram' ? 'Telegram' : 'WhatsApp'} · ID: ${chatId}</div>
      </div>
      <span class="topbar-spacer"></span>
      <span class="platform-badge ${platform}" style="font-size:.75rem;padding:4px 10px">${platform === 'telegram' ? 'Telegram' : 'WhatsApp'}</span>
    </div>
    <div class="chat-messages" id="msg-list">
      <div class="empty-state"><div class="spinner"></div></div>
    </div>`;

  try {
    const res = await fetch(`/api/chat-history/${encodeURIComponent(chatId)}?platform=${platform}`);
    const messages = await res.json();
    renderMessages(messages, displayName);
  } catch (err) {
    document.getElementById('msg-list').innerHTML =
      `<div class="empty-state"><p style="color:#dc2626">Error: ${err.message}</p></div>`;
  }
}

function renderMessages(messages, displayName) {
  const container = document.getElementById('msg-list');
  if (messages.length === 0) {
    container.innerHTML = '<div class="empty-state"><p>No messages found.</p></div>';
    return;
  }

  let html = '';
  let lastDate = null;
  const initial = displayName.replace('@','').slice(0,1).toUpperCase();

  messages.forEach(m => {
    const d = new Date(m.timestamp);
    const dateStr = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    if (dateStr !== lastDate) {
      html += `<div class="chat-date-divider"><span>${dateStr}</span></div>`;
      lastDate = dateStr;
    }

    const timeStr = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    const isOut = m.direction === 'outbound';
    const typeTag = m.msg_type && m.msg_type !== 'text'
      ? `<div class="msg-type-tag ${m.msg_type}">${m.msg_type}</div>` : '';

    html += `
      <div class="msg-row ${isOut ? 'outbound' : 'inbound'}">
        <div class="msg-avatar ${isOut ? 'bot' : ''}">${isOut ? 'BOT' : initial}</div>
        <div>
          ${typeTag}
          <div class="msg-bubble ${m.msg_type || ''}">${escHtml(m.message)}</div>
          <div class="msg-time">${timeStr}</div>
        </div>
      </div>`;
  });

  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
}

// ─── Helpers ────────────────────────────────────────────────
function relativeTime(ts) {
  if (!ts) return '';
  const diff = Date.now() - new Date(ts).getTime();
  const s = Math.floor(diff / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  if (s < 86400) return `${Math.floor(s/3600)}h ago`;
  return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function escHtml(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\n/g,'<br>');
}
function escJs(str) {
  return String(str||'').replace(/'/g,"\\'").replace(/"/g,'\\"');
}
